# Project-wide Gradle settings for the helloworld scaffold.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# AndroidX everywhere.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# :shared and :webApp wire their own js/wasmJs "webMain" intermediate source set by hand
# (explicit dependsOn edges) rather than relying on the default hierarchy template's
# same-named node, which isn't reliably present yet when their sourceSets{} blocks evaluate.
# Without this, KGP prints a "Default Kotlin Hierarchy Template Not Applied Correctly" warning
# on every build. This is a project-wide opt-out, not scoped to just that one target pair --
# if a future target combination the template also auto-groups gets added (e.g. a second
# native target), that grouping won't be created either, silently, with no warning (since the
# warning is exactly what this suppresses). Re-check this flag's still-current source sets
# against the template's grouping rules if that ever comes up.
kotlin.mpp.applyDefaultHierarchyTemplate=false
