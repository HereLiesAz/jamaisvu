name: Merged Build & Release

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute build metadata
        id: metadata
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MAJOR=$(grep 'major=' version.properties | cut -d'=' -f2)
          MINOR=$(grep 'minor=' version.properties | cut -d'=' -f2)
          MINOR_COMMIT=$(git blame -L '/minor=/',+1 version.properties | awk '{print $1}' | tr -d '^')
          if [ -n "$MINOR_COMMIT" ]; then
            PATCH=$(git rev-list --count "$MINOR_COMMIT"..HEAD)
          else
            PATCH=$(grep 'patch=' version.properties | cut -d'=' -f2)
          fi
          VERSION_NAME="$MAJOR.$MINOR.$PATCH.$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Fetch venue photos and business details from Google Places
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_API_KEY }}
        run: python3 scripts/fetch_place_photos.py

      - name: Reconstruct and verify release keystore
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        id: signing
        uses: ./.github/actions/android-keystore
        with:
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          expected-owner: ${{ secrets.KEYSTORE_OWNER }}
          keystore-private: ${{ secrets.KEYSTORE_PRIVATE }}
          keystore-public: ${{ secrets.KEYSTORE_PUBLIC }}
          keystore-chain: ${{ secrets.KEYSTORE_CHAIN }}
          keystore-rsa: ${{ secrets.KEYSTORE_RSA }}
          expected-sha1: ${{ secrets.KEYSTORE_SHA1 }}
          expected-sha256: ${{ secrets.KEYSTORE_SHA256 }}

      - name: Build with Gradle
        id: gradle-build
        env:
          LAMPLIGHT_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore-path }}
          LAMPLIGHT_KEYSTORE_TYPE: ${{ steps.signing.outputs.store-type }}
          LAMPLIGHT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LAMPLIGHT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LAMPLIGHT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; }; then
            export LAMPLIGHT_REQUIRE_SIGNING=false
            ./gradlew allTests assembleDebug -PversionBuild=$BUILD_NUMBER -PversionName=$VERSION_NAME --build-cache > build.log 2>&1
          else
            export LAMPLIGHT_REQUIRE_SIGNING=true
            ./gradlew allTests assembleRelease -PversionBuild=$BUILD_NUMBER -PversionName=$VERSION_NAME --build-cache > build.log 2>&1
          fi

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat build.log
          exit $EXIT_CODE

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lamplight-signing"

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            const assignee = 'gemini-code-assist';
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
                body: `@${assignee} /jules debug this build error\n\n**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
                labels: ['jules', 'bug'],
                assignees: [assignee]
              });
            } catch (error) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
                body: `@${assignee} /jules debug this build error\n\n**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
                labels: ['jules', 'bug']
              });
            }

      - name: Prepare Release Variables
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        run: |
          MAJOR=$(grep 'major=' version.properties | cut -d'=' -f2)
          MINOR=$(grep 'minor=' version.properties | cut -d'=' -f2)
          TAG_NAME="latest-v${MAJOR}.${MINOR}"

          if [ -f "settings.gradle.kts" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          elif [ -f "settings.gradle" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          else
            APP_NAME="Lamplight"
          fi

          APK_ORIGINAL=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGINAL" ]; then
            echo "Error: no signed release APK found"
            exit 1
          fi

          # Deliberately version-free: this filename must stay identical build to build so
          # `gh release upload --clobber` actually replaces the previous asset instead of
          # accumulating a new one next to it every time (the release notes below already
          # carry version_code/version_name for identification).
          TARGET_NAME="${APP_NAME}-release.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "APK_FILE=$TARGET_NAME" >> "$GITHUB_ENV"

      - name: Publish Release
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG_NAME" -m "Latest signed build"
          git push origin "$TAG_NAME" --force

          # The app's in-app update check (UpdateChecker.kt) parses these two lines out of the
          # release notes -- a release's tag only carries major.minor, not the full build number.
          NOTES="Signed build from commit $GITHUB_SHA

          version_code: $BUILD_NUMBER
          version_name: $VERSION_NAME"

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --prerelease \
              --title "Latest Signed Build ($TAG_NAME)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$APK_FILE" --prerelease \
              --title "Latest Signed Build ($TAG_NAME)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

  build-web:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build wasmJs distribution
        id: gradle-build
        run: |
          set +e
          ./gradlew :webApp:wasmJsBrowserDistribution --build-cache > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat build.log
          exit $EXIT_CODE

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            const assignee = 'gemini-code-assist';
            const title = `Web Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`;
            const body = `@${assignee} /jules debug this web build error\n\n**Log:**\n\`\`\`\n${logTail}\n\`\`\``;
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ['jules', 'bug'],
                assignees: [assignee]
              });
            } catch (error) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ['jules', 'bug']
              });
            }

      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy-web:
    needs: build-web
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
