name: Deploy Cloudflare Backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: cloudflare

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Wrangler
        run: npm install

      - name: Deploy Worker and provision bindings
        run: npx wrangler deploy

      - name: Apply main D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Apply media D1 migrations
        run: npx wrangler d1 migrations apply MEDIA --remote

      - name: Generate canonical QuarterMuse seed
        run: npm run seed:sql > .quartermuse-seed.sql

      - name: Seed main database
        run: npx wrangler d1 execute DB --remote --file=.quartermuse-seed.sql

      - name: Remove generated seed SQL
        if: always()
        run: rm -f .quartermuse-seed.sql

      - name: Show next Android setting
        run: |
          echo "Cloudflare backend deployed."
          echo "Set repository secret CLOUDFLARE_API_URL to the Worker URL printed by the deploy step, then dispatch Merged Build & Release."
