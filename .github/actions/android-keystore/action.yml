name: Prepare Android signing keystore
description: Reconstruct and verify the Android release keystore from repository secrets.

inputs:
  keystore-private:
    required: false
    default: ''
  keystore-rsa:
    required: false
    default: ''
  keystore-public:
    required: false
    default: ''
  keystore-chain:
    required: false
    default: ''
  keystore-password:
    required: true
  key-alias:
    required: true
  key-password:
    required: false
    default: ''
  expected-sha256:
    required: false
    default: ''
  expected-sha1:
    required: false
    default: ''
  expected-owner:
    required: false
    default: ''

outputs:
  keystore-path:
    value: ${{ steps.prepare.outputs.keystore-path }}
  store-type:
    value: ${{ steps.prepare.outputs.store-type }}
  sha256:
    value: ${{ steps.prepare.outputs.sha256 }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        KEYSTORE_PRIVATE: ${{ inputs.keystore-private }}
        KEYSTORE_RSA: ${{ inputs.keystore-rsa }}
        KEYSTORE_PUBLIC: ${{ inputs.keystore-public }}
        KEYSTORE_CHAIN: ${{ inputs.keystore-chain }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        EXPECTED_SHA1: ${{ inputs.expected-sha1 }}
        EXPECTED_OWNER: ${{ inputs.expected-owner }}
      run: |
        set -euo pipefail

        work="$RUNNER_TEMP/lamplight-signing"
        rm -rf "$work"
        mkdir -p "$work"
        chmod 700 "$work"

        [ -n "${KEYSTORE_PASSWORD:-}" ] || { echo "::error::KEYSTORE_PASSWORD is empty"; exit 1; }
        [ -n "${KEY_ALIAS:-}" ] || { echo "::error::KEY_ALIAS is empty"; exit 1; }
        if [ -z "${KEY_PASSWORD:-}" ]; then KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi
        export KEYSTORE_PASSWORD KEY_PASSWORD

        materialise() {
          local value="$1" out="$2"
          [ -n "$value" ] || return 1
          printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > "$work/.raw"
          if grep -q -- "-----BEGIN" "$work/.raw"; then
            cp "$work/.raw" "$out"
          elif tr -d '[:space:]' < "$work/.raw" | base64 --decode > "$out" 2>/dev/null && [ -s "$out" ]; then
            :
          else
            cp "$work/.raw" "$out"
          fi
          rm -f "$work/.raw"
          [ -s "$out" ]
        }

        key="$work/key.pem"
        public_material="$work/public.bin"
        cert="$work/cert.pem"
        chain="$work/chain.pem"

        if ! materialise "${KEYSTORE_PRIVATE:-}" "$key"; then
          materialise "${KEYSTORE_RSA:-}" "$key" || {
            echo "::error::Neither KEYSTORE_PRIVATE nor KEYSTORE_RSA contains a private key"
            exit 1
          }
        fi

        if ! grep -q -- "-----BEGIN" "$key"; then
          openssl pkey -inform DER -in "$key" -out "$work/key.converted.pem" 2>/dev/null \
            || openssl rsa -inform DER -in "$key" -out "$work/key.converted.pem" 2>/dev/null \
            || { echo "::error::Private key is neither PEM nor DER"; exit 1; }
          mv "$work/key.converted.pem" "$key"
        fi

        # KEYSTORE_PUBLIC in this secret set is commonly the raw public key,
        # while KEYSTORE_CHAIN carries the X.509 certificate. Accept either
        # arrangement and prefer an actual certificate whenever one is found.
        if materialise "${KEYSTORE_PUBLIC:-}" "$public_material"; then
          if grep -q -- "-----BEGIN CERTIFICATE" "$public_material"; then
            cp "$public_material" "$cert"
          elif openssl x509 -inform DER -in "$public_material" -out "$cert" 2>/dev/null; then
            :
          else
            # It is a public key rather than a certificate; verify it is at
            # least readable, then obtain the signing certificate from CHAIN.
            openssl pkey -pubin -in "$public_material" -noout 2>/dev/null \
              || openssl pkey -pubin -inform DER -in "$public_material" -noout 2>/dev/null \
              || { echo "::error::KEYSTORE_PUBLIC is neither a certificate nor a readable public key"; exit 1; }
          fi
        fi

        materialise "${KEYSTORE_CHAIN:-}" "$chain" || true
        if [ ! -s "$cert" ]; then
          [ -s "$chain" ] || { echo "::error::No X.509 certificate found in KEYSTORE_PUBLIC or KEYSTORE_CHAIN"; exit 1; }
          if grep -q -- "-----BEGIN CERTIFICATE" "$chain"; then
            cp "$chain" "$cert"
          elif openssl x509 -inform DER -in "$chain" -out "$cert" 2>/dev/null; then
            :
          else
            echo "::error::KEYSTORE_CHAIN does not contain a readable certificate"
            exit 1
          fi
        fi

        # If a separate public key was supplied, ensure it belongs to the
        # private key before generating anything.
        if [ -s "$public_material" ]; then
          if grep -q -- "PUBLIC KEY" "$public_material" || openssl pkey -pubin -inform DER -in "$public_material" -noout 2>/dev/null; then
            private_pub="$work/private-public.der"
            supplied_pub="$work/supplied-public.der"
            openssl pkey -in "$key" -pubout -outform DER -out "$private_pub"
            if grep -q -- "PUBLIC KEY" "$public_material"; then
              openssl pkey -pubin -in "$public_material" -outform DER -out "$supplied_pub"
            else
              openssl pkey -pubin -inform DER -in "$public_material" -outform DER -out "$supplied_pub"
            fi
            cmp -s "$private_pub" "$supplied_pub" || { echo "::error::KEYSTORE_PUBLIC does not match the supplied private key"; exit 1; }
          fi
        fi

        p12="$work/assembled.p12"
        keystore="$work/release.p12"
        extra=()
        if [ -s "$chain" ] && ! cmp -s "$chain" "$cert"; then extra=(-certfile "$chain"); fi

        openssl pkcs12 -export \
          -inkey "$key" \
          -in "$cert" \
          "${extra[@]}" \
          -name "$KEY_ALIAS" \
          -passout env:KEYSTORE_PASSWORD \
          -out "$p12"

        keytool -importkeystore \
          -srckeystore "$p12" -srcstoretype PKCS12 -srcstorepass:env KEYSTORE_PASSWORD \
          -srcalias "$KEY_ALIAS" \
          -destkeystore "$keystore" -deststoretype PKCS12 \
          -deststorepass:env KEYSTORE_PASSWORD -destkeypass:env KEY_PASSWORD \
          -destalias "$KEY_ALIAS" -noprompt

        chmod 600 "$keystore"
        keytool -list -v -keystore "$keystore" -storetype PKCS12 \
          -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > "$work/cert.txt"

        entry_type=$(grep -m1 '^Entry type:' "$work/cert.txt" | sed 's/^Entry type: *//' | tr -d '\r')
        [ "$entry_type" = "PrivateKeyEntry" ] || { echo "::error::Signing alias is not a PrivateKeyEntry"; exit 1; }

        norm() { tr -d ': \t\r\n' | tr '[:lower:]' '[:upper:]'; }
        actual_sha256=$(grep -m1 'SHA256:' "$work/cert.txt" | sed 's/.*SHA256: *//' | tr -d '\r')
        actual_sha1=$(grep -m1 'SHA1:' "$work/cert.txt" | sed 's/.*SHA1: *//' | tr -d '\r')
        actual_owner=$(grep -m1 '^Owner:' "$work/cert.txt" | sed 's/^Owner: *//' | tr -d '\r')

        if [ -n "${EXPECTED_SHA256:-}" ] && [ "$(printf '%s' "$actual_sha256" | norm)" != "$(printf '%s' "$EXPECTED_SHA256" | norm)" ]; then
          echo "::error::Signing certificate SHA-256 mismatch"
          exit 1
        fi
        if [ -n "${EXPECTED_SHA1:-}" ] && [ "$(printf '%s' "$actual_sha1" | norm)" != "$(printf '%s' "$EXPECTED_SHA1" | norm)" ]; then
          echo "::error::Signing certificate SHA-1 mismatch"
          exit 1
        fi
        if [ -n "${EXPECTED_OWNER:-}" ] && [ "$actual_owner" != "$EXPECTED_OWNER" ]; then
          echo "::warning::Signing certificate owner differs from KEYSTORE_OWNER"
        fi

        {
          echo "keystore-path=$keystore"
          echo "store-type=PKCS12"
          echo "sha256=$actual_sha256"
        } >> "$GITHUB_OUTPUT"

        rm -f "$p12" "$key" "$public_material" "$cert" "$chain" \
          "$work/private-public.der" "$work/supplied-public.der" "$work/cert.txt"
